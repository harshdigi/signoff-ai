# Signoff AI's tmux settings. Used only on the app's own socket (tmux -L decision-ide); ~/.tmux.conf is not read.
set -s escape-time 0
set -g history-limit 5000
set -g mouse on
set -g window-size latest
set -g default-terminal "tmux-256color"
set -g status-left "Signoff AI · #S · Ctrl-b d to detach "
set -g status-left-length 80
set -g status-right ""
